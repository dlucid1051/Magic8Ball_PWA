<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favSphere" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="30%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="favGlow" cx="28%" cy="24%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#a5b4fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0" />
    </radialGradient>
    <filter id="favDrop">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="32" cy="32" r="30" fill="#4338ca" opacity="0.25" filter="blur(3px)" />

  <!-- Ball Body -->
  <circle cx="32" cy="32" r="28" fill="url(#favSphere)" stroke="#334155" stroke-width="1.2" />

  <!-- Top Glass Specular Arc -->
  <ellipse cx="25" cy="20" rx="13" ry="7" transform="rotate(-24 25 20)" fill="url(#favGlow)" />

  <!-- Rim Bounce Light -->
  <path d="M 18 51 A 28 28 0 0 0 46 51 A 26 26 0 0 1 18 51 Z" fill="#818cf8" opacity="0.35" />

  <!-- Number 8 Inner Disc -->
  <g filter="url(#favDrop)">
    <circle cx="32" cy="32" r="13" fill="#0b0f19" stroke="#4f46e5" stroke-width="1.2" />
  </g>

  <!-- Typography 8 -->
  <text x="32" y="38" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="17" fill="#c7d2fe" text-anchor="middle" letter-spacing="-0.5">8</text>
</svg>
