<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="25%" stop-color="#2d3748" />
      <stop offset="60%" stop-color="#111520" />
      <stop offset="100%" stop-color="#05070b" />
    </radialGradient>
    <radialGradient id="specularGlow" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="innerBadge" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="innerRimShadow">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3"/>
      <feComposite operator="out" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="236" fill="#1e1b4b" opacity="0.3" filter="blur(20px)" />

  <!-- Ball Body -->
  <circle cx="256" cy="256" r="230" fill="url(#sphereGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Specular Reflection Overlay -->
  <ellipse cx="200" cy="150" rx="140" ry="85" transform="rotate(-22 200 150)" fill="url(#specularGlow)" />
  
  <!-- Subtle Bottom Rim Light (Bounce Reflection) -->
  <path d="M 120 420 A 230 230 0 0 0 392 420 A 224 224 0 0 1 120 420 Z" fill="#6366f1" opacity="0.22" />

  <!-- White Number Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="256" cy="256" r="96" fill="url(#innerBadge)" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Number 8 Typography -->
  <!-- Top Loop -->
  <path d="M 256 195 
           C 238 195 226 206 226 221 
           C 226 236 238 245 256 250 
           C 274 245 286 236 286 221 
           C 286 206 274 195 256 195 Z" 
        fill="none" stroke="#090d16" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Bottom Loop -->
  <path d="M 256 252 
           C 234 252 220 266 220 286 
           C 220 307 236 321 256 321 
           C 276 321 292 307 292 286 
           C 292 266 278 252 256 252 Z" 
        fill="none" stroke="#090d16" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Shine on 8 Badge -->
  <ellipse cx="230" cy="205" rx="35" ry="16" transform="rotate(-25 230 205)" fill="#ffffff" opacity="0.6" />
</svg>
